include:
  - path: backend/back-springboot-arsdev/compose.yml
  - path: frontend/frontend-web-vue/compose.yml
  - path: orm/service-odoo-sembrem/compose.yml

services:
  nginx-global:
    image: nginx:alpine
    container_name: nginx_global
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/nginx-full.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certs/dev:/etc/nginx/certs:ro
      - ./log/nginx:/var/log/nginx
    depends_on:
      back-spring:
        condition: service_started
      odoo_sembrem:
        condition: service_started
      frontend:
        condition: service_started
